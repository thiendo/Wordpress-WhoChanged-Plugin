<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WhoChanged Playground embed — snippet</title>
	<style>
		html, body { margin: 0; height: 100%; background: #000; }
		.whochanged-playground {
			width: 100%;
			height: min(80vh, 900px);
			border: 0;
			border-radius: 16px;
			background: #111;
		}
	</style>
</head>
<body>
<iframe
	class="whochanged-playground"
	title="WhoChanged live demo"
	loading="lazy"
	allow="fullscreen"
	src="https://playground.wordpress.net/?blueprint-url=https://raw.githubusercontent.com/thiendo/wordpress-whochanged-demo/main/blueprint.json"
></iframe>

https://playground.wordpress.net/?blueprint-url=https://raw.githubusercontent.com/thiendo/wordpress-whochanged-demo/main/blueprint.json

https://raw.githubusercontent.com/thiendo/wordpress-whochanged-demo/main/whochanged-demo.zip

</body>
</html>
